<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Личный трекер целей, привычек, расписания и финансов" />
    <title>Мой трекер</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f9fc;color:#17243a;font-family:system-ui,-apple-system,sans-serif">
        <div style="text-align:center;padding:24px">
          <div style="font-size:22px;font-weight:700">Мой трекер</div>
          <div style="margin-top:8px;color:#8995a7;font-size:14px">Загрузка приложения…</div>
          <div id="boot-error" style="display:none;margin-top:14px;color:#b91c1c;font-size:13px;max-width:600px;overflow-wrap:anywhere"></div>
        </div>
      </div>
    </div>
    <script>
      function showBootError(message) {
        var box = document.getElementById('boot-error');
        if (!box) return;
        box.textContent = 'Ошибка запуска: ' + message;
        box.style.display = 'block';
      }
      window.addEventListener('error', function (event) {
        showBootError(event.message || 'Неизвестная ошибка JavaScript');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || 'Неизвестная ошибка');
        showBootError(reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
